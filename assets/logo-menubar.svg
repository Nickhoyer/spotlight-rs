<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spotlight menu bar icon">
  <!-- Template image: pure black on transparent. Set NSImage.isTemplate = true so
       macOS tints it for light/dark menu bars. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <!-- visible glyph = white -->
      <path d="M5.5,5.5 L16.54,8.19 A6.5,6.5 0 1 1 8.77,16.37 Z" fill="#fff"/>
      <!-- result lines knocked out = black -->
      <rect x="11.3" y="11.6" width="7.0" height="1.3" rx="0.65" fill="#000"/>
      <rect x="11.3" y="13.85" width="8.4" height="1.3" rx="0.65" fill="#000"/>
      <rect x="11.3" y="16.1" width="5.4" height="1.3" rx="0.65" fill="#000"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="24" height="24" fill="#000000" mask="url(#cut)"/>
</svg>
