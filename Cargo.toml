[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/platform-macos",
    "crates/htmlview",
    "crates/ui",
    "crates/app",
    "extensions/apps",
    "extensions/calculator",
    "extensions/clipboard",
    "extensions/gmail",
    "extensions/jira",
    "extensions/llm",
    "extensions/scripts",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Pinned to a specific gpui-ce commit; GPUI is pre-1.0 and churns, so we keep
# both gpui and its platform crate from the same source tree (see plan).
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "ce08af96db6c3474ab3b388325cdd1a7c3de06d9" }
# `font-kit` is REQUIRED on macOS for real glyph rasterization — without it
# gpui falls back to a placeholder text system that renders no glyphs (blank
# text). The feature didn't propagate transitively, so we enable it directly.
# `runtime_shaders` compiles Metal shaders at runtime instead of build time.
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "ce08af96db6c3474ab3b388325cdd1a7c3de06d9", features = ["font-kit", "runtime_shaders"] }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
nucleo-matcher = "0.3"
plist = "1"
walkdir = "2"
meval = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP client. No async runtime needed — calls run on gpui's
# background executor. `json` pulls in serde_json round-tripping; default
# features include rustls TLS for https://*.atlassian.net.
ureq = { version = "2", features = ["json"] }
# Basic-auth header encoding for the Jira API.
base64 = "0.22"
# IMAP + MIME parsing for the Gmail extension (app-password auth, read-only).
imap = "2"
native-tls = "0.2"
mail-parser = "0.11"
# Headless HTML/CSS renderer (Servo's Stylo + CPU Vello) for HTML email bodies.
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
blitz-dom = "=0.3.0-beta.1"
blitz-html = "=0.3.0-beta.1"
blitz-paint = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
# URL parsing (already in the tree via blitz): origin checks so the HTML
# renderer only sends auth headers to the configured site.
url = "2"
# Must match gpui's image version (RenderImage frames are image::Frame).
# png enables the encoder used by ext-gmail's local-server image test.
image = { version = "0.25", default-features = false, features = ["png"] }
# macOS Keychain storage for the Jira API token in release builds.
security-framework = "2"

# Internal crates
spotlight-core = { path = "crates/core" }
spotlight-config = { path = "crates/config" }
spotlight-platform-macos = { path = "crates/platform-macos" }
spotlight-htmlview = { path = "crates/htmlview" }
spotlight-ui = { path = "crates/ui" }
ext-apps = { path = "extensions/apps" }
ext-calculator = { path = "extensions/calculator" }
ext-clipboard = { path = "extensions/clipboard" }
ext-gmail = { path = "extensions/gmail" }
ext-jira = { path = "extensions/jira" }
ext-llm = { path = "extensions/llm" }
ext-scripts = { path = "extensions/scripts" }

# stylo's ToCss derive emits untyped `Ok(())?` whose error-type inference
# breaks when anything else in the graph impls `From<..> for fmt::Error`
# (gpui → zed log kv features → serde_fmt does). Vendored one-line fix; see
# third_party/stylo_derive/PATCH-NOTE.md.
[patch.crates-io]
stylo_derive = { path = "third_party/stylo_derive" }

[profile.dev]
# GPUI is heavy; a little optimization on deps keeps dev runs smooth without
# slowing our own iterative compiles.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
